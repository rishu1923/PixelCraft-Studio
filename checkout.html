<section class="page-section">
    <h1>Checkout</h1>
    <p>Complete your order by filling in the details below.</p>

    <form class="checkout-form" action="success.html"></form>

        <input type="text" placeholder="Full Name" required>

        <input type="email" placeholder="Email Address" required>

        <input type="tel" placeholder="Phone Number" required>

        <textarea placeholder="Project Requirements" rows="5"></textarea>

        <select required>
            <option>Select Package</option>
            <option>Logo Design - ₹999</option>
            <option>Thumbnail Design - ₹499</option>
            <option>Poster Design - ₹799</option>
        </select>

        <button type="submit" class="btn">Place Order</button>

    </form>
